# Render Blueprint — NextCommerce API
# Provisiona o banco e o serviço da API. Para usar Supabase Staging,
# remova o bloco `databases` e defina DATABASE_URL manualmente apontando
# para o pooler do Supabase (ver docs/deploy/env.md).
databases:
  - name: nextcommerce-db
    databaseName: nextcommerce
    user: nextcommerce
    plan: free
    postgresMajorVersion: 16

services:
  - type: web
    name: nextcommerce-api
    runtime: node
    plan: free
    region: oregon
    rootDir: apps/api
    buildCommand: pnpm install && pnpm --filter @nextcommerce/api build
    startCommand: node dist/main.js
    healthCheckPath: /ready
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nextcommerce-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: API_URL
        value: https://nextcommerce-api.onrender.com
      - key: API_PUBLIC_URL
        value: https://nextcommerce-api.onrender.com
      - key: FRONTEND_URL
        value: https://nextcommerce-web.vercel.app
      - key: JWT_SECRET
        generateValue: true
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: MERCADO_PAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADO_PAGO_PUBLIC_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
